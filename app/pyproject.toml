[project]
name = "releasenotes-portal"
version = "1.0.0"
description = "Local release notes portal"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["releasenotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
